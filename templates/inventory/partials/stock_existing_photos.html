{% load i18n %}
{% if item and item.photos.all %}
<div class="stock-photo-gallery">
  <p class="eyebrow">{% trans "Yuklangan rasmlar" %}</p>
  <ul class="stock-photo-list">
    {% for p in item.photos.all %}
    <li>
      <button type="button" class="stock-photo-open" data-photo-preview="{{ p.image.url }}" aria-label="{% trans 'Rasmni kattalashtirish' %}">
        <img src="{{ p.image.url }}" alt="" width="92" height="92">
      </button>
      <label>
        <input type="checkbox" name="remove_photo" value="{{ p.pk }}">
        {% trans "O‘chirish" %}
      </label>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
