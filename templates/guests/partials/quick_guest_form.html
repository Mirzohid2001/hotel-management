{% load i18n %}
<div class="modal-overlay" role="presentation" onclick="if(event.target===this){this.closest('#modal-root').innerHTML='';document.body.classList.remove('modal-open');}">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="{{ title }}">
    <div class="quick-add-head">
      <strong>{{ title }}</strong>
      <button type="button" class="btn-ghost" onclick="document.getElementById('modal-root').innerHTML='';document.body.classList.remove('modal-open');">
        {% trans "Yopish" %}
      </button>
    </div>
    <form class="stack-form quick-add-form"
          hx-post="{% url 'guests:quick_guest' %}"
          hx-target="#modal-root" hx-select="unset"
          hx-swap="innerHTML">
      {% csrf_token %}
      <input type="hidden" name="select_id" value="{{ select_id }}">
      <input type="hidden" name="field_name" value="{{ field_name }}">
      <p class="muted quick-guest-hint">
        {% trans "Zayezd uchun pasport yoki ID raqami majburiy." %}
      </p>
      {% if form.non_field_errors %}
      <div class="form-errors">{{ form.non_field_errors }}</div>
      {% endif %}
      <div class="quick-guest-grid">
        {% for field in form %}
        <label class="folio-field{% if field.name == 'doc_number' or field.name == 'phone' %} folio-field-wide{% endif %}">
          <span>{{ field.label }}{% if field.field.required %} *{% endif %}</span>
          {{ field }}
          {% if field.errors %}<em class="field-error">{{ field.errors }}</em>{% endif %}
        </label>
        {% endfor %}
      </div>
      <button type="submit" class="btn">{% trans "Qo‘shish" %}</button>
    </form>
  </div>
</div>
